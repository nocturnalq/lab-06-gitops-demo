apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel
spec:
  interval: 1m
  timeout: 10m
  dependsOn:
    - name: vm
  chart:
    spec:
      chart: opentelemetry-kube-stack
      version: 0.27.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: otel-values
