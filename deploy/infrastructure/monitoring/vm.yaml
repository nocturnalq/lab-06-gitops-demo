apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.98.1
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: vm-values
