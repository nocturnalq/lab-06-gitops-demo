apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - vm.yaml
  - repositories.yaml
  - otel.yaml
configMapGenerator:
  - name: vm-values
    files:
      - values.yaml=vm-values.yaml
  - name: otel-values
    files:
      - values.yaml=otel-values.yaml

configurations:
 - kustomizeconfig.yaml
