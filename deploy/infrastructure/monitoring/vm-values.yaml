fullnameOverride: vm

victoria-metrics-operator:
  enabled: true
  serviceMonitor:
    enabled: true

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "7d"
    storage:
      resources:
        requests:
          storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    serviceSpec:
      useAsDefault: true
      spec:
        type: NodePort
        ports:
          - name: http
            port: 8428
            targetPort: 8428
            nodePort: 31400

vlsingle:
  enabled: true
  spec:
    retentionPeriod: "7d"
    storage:
      resources:
        requests:
          storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    serviceSpec:
      useAsDefault: true
      spec:
        type: NodePort
        ports:
          - name: http
            port: 9428
            targetPort: 9428
            nodePort: 31500

vtsingle:
  enabled: true
  spec:
    retentionPeriod: "7d"
    storage:
      resources:
        requests:
          storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    serviceSpec:
      useAsDefault: true
      spec:
        type: NodePort
        ports:
          - name: http
            port: 10428
            targetPort: 10428
            nodePort: 31600

vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

vlagent:
  enabled: false

# Правила алертов и их вычисление.
defaultRules:
  create: true
vmalert:
  enabled: true

alertmanager:
  enabled: true
  spec:
    serviceSpec:
      useAsDefault: true
      spec:
        type: NodePort
        ports:
          - name: http
            port: 9093
            targetPort: 9093
            nodePort: 31700

grafana:
  enabled: true
  plugins:
    - victoriametrics-metrics-datasource
    - victoriametrics-logs-datasource
  service:
    type: NodePort
    nodePort: 31300
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true

kubeApiServer:
  enabled: true
kubelet:
  enabled: true
coreDns:
  enabled: true
kubeControllerManager:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: https
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            insecureSkipVerify: true
kubeScheduler:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: https
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            insecureSkipVerify: true
kubeEtcd:
  enabled: true
  service:
    port: 2381
    targetPort: 2381
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: http
kubeProxy:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: http
